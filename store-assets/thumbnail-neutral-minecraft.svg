<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07121f"/>
      <stop offset="0.6" stop-color="#17334a"/>
      <stop offset="1" stop-color="#31566a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b25" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#1d2b37" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66d17a"/>
      <stop offset="0.52" stop-color="#58c6d8"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <!-- Calm block-world backdrop -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect x="0" y="0" width="1600" height="900" fill="#02080d" opacity="0.13"/>

  <!-- Square stars and clouds -->
  <g fill="#b8d7dd" opacity="0.38">
    <rect x="112" y="92" width="10" height="10"/>
    <rect x="278" y="152" width="7" height="7"/>
    <rect x="480" y="74" width="12" height="12"/>
    <rect x="1180" y="96" width="8" height="8"/>
    <rect x="1436" y="168" width="11" height="11"/>
  </g>
  <g fill="#7890a0" opacity="0.18">
    <rect x="1020" y="154" width="210" height="42"/>
    <rect x="1060" y="126" width="118" height="30"/>
    <rect x="126" y="220" width="186" height="36"/>
    <rect x="166" y="192" width="104" height="30"/>
  </g>

  <!-- Stepped mountain silhouettes -->
  <path d="M0 560H90V510H170V470H250V520H340V565H430V900H0Z" fill="#132938"/>
  <path d="M1190 900V548H1260V498H1330V444H1400V490H1470V530H1530V500H1600V900Z" fill="#102632"/>
  <path d="M0 640H85V600H170V620H250V580H330V622H420V590H510V900H0Z" fill="#1a3743" opacity="0.78"/>

  <!-- Ground made from deliberately regular tiles -->
  <g>
    <rect x="0" y="690" width="1600" height="210" fill="#26333b"/>
    <rect x="0" y="666" width="1600" height="24" fill="#628a47"/>
    <rect x="0" y="690" width="1600" height="56" fill="#5a4634"/>
    <g stroke="#33424a" stroke-width="4" opacity="0.85">
      <path d="M0 746H1600M0 824H1600"/>
      <path d="M100 690V746M300 690V746M500 690V746M700 690V746M900 690V746M1100 690V746M1300 690V746M1500 690V746"/>
      <path d="M0 746V824M200 746V824M400 746V824M600 746V824M800 746V824M1000 746V824M1200 746V824M1400 746V824M1600 746V824"/>
      <path d="M100 824V900M300 824V900M500 824V900M700 824V900M900 824V900M1100 824V900M1300 824V900M1500 824V900"/>
    </g>
    <g fill="#61818c" opacity="0.62">
      <rect x="248" y="780" width="18" height="18"/>
      <rect x="270" y="802" width="12" height="12"/>
      <rect x="1238" y="850" width="18" height="18"/>
      <rect x="1260" y="830" width="12" height="12"/>
    </g>
  </g>

  <!-- Main readable store panel -->
  <g filter="url(#shadow)">
    <rect x="110" y="250" width="1380" height="430" rx="22" fill="url(#panel)" stroke="#66808d" stroke-width="3"/>
    <rect x="110" y="250" width="12" height="430" rx="6" fill="#67c77b"/>
  </g>

  <!-- Deterministic pixel radio -->
  <g transform="translate(190 318)">
    <rect x="38" y="28" width="320" height="250" rx="12" fill="#845a38" stroke="#bb8751" stroke-width="8"/>
    <rect x="60" y="52" width="276" height="52" rx="4" fill="#172630"/>
    <g fill="#7bd28a">
      <rect x="82" y="70" width="20" height="18"/>
      <rect x="112" y="62" width="12" height="34"/>
      <rect x="134" y="72" width="18" height="16"/>
      <rect x="162" y="58" width="12" height="42"/>
      <rect x="184" y="68" width="20" height="22"/>
    </g>
    <rect x="74" y="126" width="164" height="126" rx="6" fill="#18252c" stroke="#354b55" stroke-width="6"/>
    <rect x="96" y="148" width="120" height="82" fill="#263942"/>
    <rect x="116" y="164" width="80" height="50" fill="#111b20"/>
    <rect x="250" y="132" width="64" height="64" rx="8" fill="#d2b46a"/>
    <rect x="266" y="148" width="32" height="32" rx="4" fill="#26333b"/>
    <rect x="258" y="214" width="48" height="16" rx="4" fill="#d2b46a"/>
    <rect x="280" y="0" width="10" height="36" fill="#b6c3c7"/>
    <rect x="286" y="-60" width="10" height="66" fill="#b6c3c7" transform="rotate(23 291 -27)"/>
    <rect x="58" y="278" width="76" height="16" fill="#3a2920"/>
    <rect x="262" y="278" width="76" height="16" fill="#3a2920"/>
  </g>

  <!-- Store copy -->
  <g font-family="DejaVu Sans, sans-serif">
    <text x="630" y="350" fill="#91a9b5" font-size="25" font-weight="700" letter-spacing="4">LABYMOD 4 ADDON</text>
    <text x="630" y="430" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="1">DYHNUNITY</text>
    <text x="630" y="500" fill="#67c77b" font-size="64" font-weight="800" letter-spacing="1">RADIO PLAYER</text>
    <text x="634" y="553" fill="#c7d3d8" font-size="27">Your stations. Your sound. Directly in Minecraft.</text>
  </g>

  <!-- Clean equalizer -->
  <g fill="url(#wave)" opacity="0.95">
    <rect x="634" y="592" width="12" height="18" rx="3"/>
    <rect x="656" y="582" width="12" height="38" rx="3"/>
    <rect x="678" y="568" width="12" height="66" rx="3"/>
    <rect x="700" y="578" width="12" height="46" rx="3"/>
    <rect x="722" y="588" width="12" height="26" rx="3"/>
    <rect x="744" y="572" width="12" height="58" rx="3"/>
    <rect x="766" y="560" width="12" height="82" rx="3"/>
    <rect x="788" y="576" width="12" height="50" rx="3"/>
    <rect x="810" y="589" width="12" height="24" rx="3"/>
    <rect x="832" y="580" width="12" height="42" rx="3"/>
    <rect x="854" y="570" width="12" height="62" rx="3"/>
    <rect x="876" y="586" width="12" height="30" rx="3"/>
    <rect x="898" y="592" width="12" height="18" rx="3"/>
  </g>

  <!-- Provider chips -->
  <g font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#dbe7ea">
    <g transform="translate(940 581)"><rect width="100" height="42" rx="8" fill="#263c46"/><text x="50" y="27" text-anchor="middle">LAUT.FM</text></g>
    <g transform="translate(1050 581)"><rect width="150" height="42" rx="8" fill="#263c46"/><text x="75" y="27" text-anchor="middle">RADIO BROWSER</text></g>
    <g transform="translate(1210 581)"><rect width="135" height="42" rx="8" fill="#263c46"/><text x="67.5" y="27" text-anchor="middle">I LOVE MUSIC</text></g>
    <g transform="translate(1355 581)"><rect width="110" height="42" rx="8" fill="#263c46"/><text x="55" y="27" text-anchor="middle">RADIOREG</text></g>
  </g>
</svg>
